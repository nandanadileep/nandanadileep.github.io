<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris | Nandana Dileep</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
        }
        
        .container {
            text-align: center;
        }
        
        h1 {
            margin-bottom: 1rem;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s ease;
        }
        
        .back-link:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .game-container {
            display: flex;
            gap: 2rem;
            align-items: start;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        canvas {
            border: 4px solid rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            background: #1a1a2e;
        }
        
        .info-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 12px;
            min-width: 200px;
        }
        
        .score {
            margin-bottom: 1.5rem;
        }
        
        .score h2 {
            font-size: 1rem;
            margin-bottom: 0.5rem;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        .score-value {
            font-size: 2rem;
            font-weight: 700;
        }
        
        .controls {
            text-align: left;
            opacity: 0.9;
            font-size: 0.9rem;
        }
        
        .controls h3 {
            margin-bottom: 0.75rem;
            font-size: 1rem;
        }
        
        .controls ul {
            list-style: none;
            padding: 0;
        }
        
        .controls li {
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
        }
        
        .controls kbd {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            font-family: monospace;
            font-weight: 600;
        }
        
        button {
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 100;
        }
        
        .game-over.show {
            display: block;
        }
        
        .game-over h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        
        .game-over p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Tetris</h1>
        <a href="/" class="back-link">← Back to Home</a>
        
        <div class="game-container">
            <canvas id="tetris" width="240" height="400"></canvas>
            
            <div class="info-panel">
                <div class="score">
                    <h2>Score</h2>
                    <div class="score-value" id="score">0</div>
                </div>
                
                <div class="score">
                    <h2>Level</h2>
                    <div class="score-value" id="level">1</div>
                </div>
                
                <button id="restart">Restart Game</button>
                
                <div class="controls">
                    <h3>Controls</h3>
                    <ul>
                        <li><kbd>←</kbd> Move Left</li>
                        <li><kbd>→</kbd> Move Right</li>
                        <li><kbd>↓</kbd> Soft Drop</li>
                        <li><kbd>↑</kbd> Rotate</li>
                        <li><kbd>Space</kbd> Hard Drop</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    
    <div class="game-over" id="gameOver">
        <h2>Game Over!</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button onclick="location.reload()">Play Again</button>
        <button onclick="location.href='/'">Go Home</button>
    </div>
    
    <script>
        const canvas = document.getElementById('tetris');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');
        
        const COLS = 12;
        const ROWS = 20;
        const BLOCK_SIZE = 20;
        
        const COLORS = [
            null,
            '#FF0D72',
            '#0DC2FF',
            '#0DFF72',
            '#F538FF',
            '#FF8E0D',
            '#FFE138',
            '#3877FF'
        ];
        
        const SHAPES = [
            [[1, 1, 1, 1]],
            [[2, 2], [2, 2]],
            [[0, 3, 0], [3, 3, 3]],
            [[4, 4, 0], [0, 4, 4]],
            [[0, 5, 5], [5, 5, 0]],
            [[6, 0, 0], [6, 6, 6]],
            [[0, 0, 7], [7, 7, 7]]
        ];
        
        let board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
        let score = 0;
        let level = 1;
        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let gameOver = false;
        
        let piece = {
            shape: null,
            x: 0,
            y: 0
        };
        
        function drawBlock(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.strokeRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
        }
        
        function drawBoard() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            board.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        drawBlock(x, y, COLORS[value]);
                    }
                });
            });
        }
        
        function drawPiece() {
            piece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        drawBlock(piece.x + x, piece.y + y, COLORS[value]);
                    }
                });
            });
        }
        
        function collide() {
            for (let y = 0; y < piece.shape.length; y++) {
                for (let x = 0; x < piece.shape[y].length; x++) {
                    if (piece.shape[y][x] &&
                        (board[piece.y + y] &&
                        board[piece.y + y][piece.x + x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }
        
        function merge() {
            piece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        board[piece.y + y][piece.x + x] = value;
                    }
                });
            });
        }
        
        function rotate() {
            const rotated = piece.shape[0].map((_, i) =>
                piece.shape.map(row => row[i]).reverse()
            );
            
            const prevShape = piece.shape;
            piece.shape = rotated;
            
            if (collide()) {
                piece.shape = prevShape;
            }
        }
        
        function move(dir) {
            piece.x += dir;
            if (collide()) {
                piece.x -= dir;
            }
        }
        
        function drop() {
            piece.y++;
            if (collide()) {
                piece.y--;
                merge();
                clearLines();
                newPiece();
                
                if (collide()) {
                    endGame();
                }
            }
            dropCounter = 0;
        }
        
        function hardDrop() {
            while (!collide()) {
                piece.y++;
            }
            piece.y--;
            merge();
            clearLines();
            newPiece();
            
            if (collide()) {
                endGame();
            }
        }
        
        function clearLines() {
            let linesCleared = 0;
            
            outer: for (let y = board.length - 1; y >= 0; y--) {
                for (let x = 0; x < board[y].length; x++) {
                    if (board[y][x] === 0) {
                        continue outer;
                    }
                }
                
                board.splice(y, 1);
                board.unshift(Array(COLS).fill(0));
                linesCleared++;
                y++;
            }
            
            if (linesCleared > 0) {
                score += linesCleared * 100 * level;
                level = Math.floor(score / 1000) + 1;
                dropInterval = Math.max(100, 1000 - (level - 1) * 100);
                updateScore();
            }
        }
        
        function newPiece() {
            const shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
            piece = {
                shape: shape.map(row => [...row]),
                x: Math.floor(COLS / 2) - Math.floor(shape[0].length / 2),
                y: 0
            };
        }
        
        function updateScore() {
            scoreElement.textContent = score;
            levelElement.textContent = level;
        }
        
        function endGame() {
            gameOver = true;
            finalScoreElement.textContent = score;
            gameOverElement.classList.add('show');
        }
        
        function update(time = 0) {
            if (gameOver) return;
            
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            
            if (dropCounter > dropInterval) {
                drop();
            }
            
            drawBoard();
            drawPiece();
            
            requestAnimationFrame(update);
        }
        
        document.addEventListener('keydown', event => {
            if (gameOver) return;
            
            if (event.key === 'ArrowLeft') {
                move(-1);
            } else if (event.key === 'ArrowRight') {
                move(1);
            } else if (event.key === 'ArrowDown') {
                drop();
            } else if (event.key === 'ArrowUp') {
                rotate();
            } else if (event.key === ' ') {
                event.preventDefault();
                hardDrop();
            }
        });
        
        document.getElementById('restart').addEventListener('click', () => {
            location.reload();
        });
        
        newPiece();
        update();
    </script>
</body>
</html>
